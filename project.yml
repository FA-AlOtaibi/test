name: FahadERP
options:
  bundleIdPrefix: com.fahad
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  FahadERP:
    type: application
    platform: iOS
    sources:
      - path: FahadERP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fahad.erp
        PRODUCT_NAME: FahadERP
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fahad ERP"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Supabase
        product: Supabase
